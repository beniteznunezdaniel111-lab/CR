name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos y tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Base de datos (RLS) y E2E con Supabase
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    env:
      AI_PROVIDER: mock
      SIGNUP_ACCESS_CODE: e2e-access-code
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Arrancar Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta

      - name: Generar .env.local
        run: pnpm env:local

      - name: Tests de base de datos (aislamiento y permisos)
        run: pnpm test:db

      - name: Datos de demo (seed)
        run: pnpm db:seed

      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests E2E
        run: pnpm test:e2e

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
